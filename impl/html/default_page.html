<style>
  .centered {
    width: 100dvw;
    align-items: center;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0px;
    background-color: inherit;
    padding: 0;
  }

  :root {
    font-family: Seravek, 'Gill Sans Nova', Ubuntu, Calibri, 'DejaVu Sans', source-sans-pro, sans-serif;
  }

  body {
    margin: 0;
  }

  .links {
    margin: 0 0 0 5dvw;
  }

  #rescan_button {
    position: fixed;
    bottom: 10px;
    top: auto;
    left: 10px;
    right auto;
  }
</style>

<head>
  <title>miniwoofer</title>
</head>

<body>
  <div class="centered">
    <h2>MiniWoofer</h2></br>
    <form action="/" method="GET">
      <label for="search">Search:</label>
      <input type=text id="search" name=query value="{{.Joined_terms}}">
      <button type="submit">Go!</button>
    </form>
  </div>
  <div class="links">
    {{range .Results}} <a href="corpus/{{.Id}}">{{.Title}}</a> <button command="toggle-popover"
      popovertarget="management{{.Id}}">...</button> <br>
    <iframe sandbox="allow-forms allow-scripts allow-same-origin allow-top-navigation-by-user-activation" popover="auto"
      id="management{{.Id}}" src="management.html?doc={{.Id}}" style="width: 50dvw; height: 30dvh;"></iframe>


    {{end}}
  </div>

  <a href="triggers/rescan" id="rescan_button">
    <button onclick="this.disabled = true;">Rescan Corpus</button>
  </a>
</body>
