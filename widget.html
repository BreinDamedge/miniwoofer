<div style="all:revert;">
  <style>
    #miniwoofer_widget_toggle {
      anchor-name: --miniwoofer-widget-toggle;
      position: fixed;
      bottom: 25px;
    }

    #miniwoofer_search_widget {
      position-anchor: --miniwoofer-widget-toggle;
      position: fixed;
      top: auto;
      bottom: anchor(top);
      left: anchor(left);
      margin: 0;
    }
  </style>
  <button command="toggle-popover" popovertarget="miniwoofer_search_widget" id="miniwoofer_widget_toggle">Woof</button>
  <div popover="auto" id="miniwoofer_search_widget" anchor="miniwoofer_widget_toggle">
    <form action="/" method="GET">
      <label for="search">Search:</label>
      <input type=text id="search" name=query>
      <button formmethod="GET" formtarget="search">Go!</button>
    </form>
  </div>
</div>
